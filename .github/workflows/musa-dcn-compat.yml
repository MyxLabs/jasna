name: BasicVSR++ DCNv2 compatibility

on:
  pull_request:
    paths:
      - 'jasna/models/basicvsrpp/musa_deform_conv.py'
      - 'jasna/models/basicvsrpp/mmagic/basicvsr_plusplus_net.py'
      - 'tests/test_musa_deform_conv.py'
      - 'scripts/check_musa_basicvsrpp.py'
      - '.github/workflows/musa-dcn-compat.yml'
  push:
    branches:
      - compat/musa-s4000-basicvsrpp

jobs:
  cpu-dcn-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU torch/torchvision
        run: |
          python -m pip install "numpy<2" pytest
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: python -m compileall -q jasna/models/basicvsrpp/musa_deform_conv.py scripts/check_musa_basicvsrpp.py
      - name: Test fallback numerics and gradients
        run: python -m pytest -q tests/test_musa_deform_conv.py
